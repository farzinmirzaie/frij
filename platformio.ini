[platformio]
default_envs = emulator_StopWatch

[env]
build_flags =
  -std=c++17
  -I include
  -I src
  -I src/utility
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -D LVGL_USE_V9=1
lib_deps =
  https://github.com/m5stack/M5GFX#develop
  lvgl=https://github.com/lvgl/lvgl#master
  bblanchon/ArduinoJson@^7
lib_archive = false

; Round 466x466 emulator on LVGL's own SDL driver — previews the UI at the real
; device resolution + round shape (src/utility/sdl_lvgl_main.cpp). The default.
[env:emulator_StopWatch]
platform = native@^1.2.1
build_type = debug
extra_scripts = support/sdl2_build_extra.py
build_flags =
  ${env.build_flags}
  !pkg-config --cflags SDL2
  !pkg-config --libs SDL2
  -arch arm64
  -l curl
  -pthread                     ; background threads for non-blocking cloud I/O
  -D FRIJ_USE_LV_SDL           ; turn on LVGL's SDL driver (see lv_conf.h)
build_src_filter =
  +<*>
  -<main.cpp>
  -<utility/lvgl_port_m5stack.cpp>

; Headless snapshot tool — renders the UI offscreen to /tmp/frij_snapshot.bmp
; (no window). For visual verification where screencapture can't reach the display.
[env:snapshot]
platform = native@^1.2.1
build_flags =
  ${env.build_flags}
  !pkg-config --cflags SDL2
  !pkg-config --libs SDL2
  -arch arm64
  -O2
  -l curl
  -pthread
  -D FRIJ_SNAPSHOT
build_src_filter =
  +<*>
  -<main.cpp>
  -<utility/lvgl_port_m5stack.cpp>
  -<utility/sdl_lvgl_main.cpp>

; Real device — M5Stack StopWatch (ESP32-S3). M5Unified brings the board up
; (panel reset via M5IOE1, touch, BMI270 IMU, PMIC) and auto-detects the panel;
; our LVGL port then drives M5.Display. Not built in CI here (no ESP toolchain) —
; verify on flash. See docs/HARDWARE.md.
[env:device]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
lib_deps =
  ${env.lib_deps}
  m5stack/M5Unified
build_flags =
  ${env.build_flags}
  -D BOARD_HAS_PSRAM
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  ; M5Unified auto-detects the StopWatch panel; set -D M5GFX_BOARD=... only if needed.
  ; Cloud config for the on-device AI (system/ai) — baked in from the shell env
  ; at build time so the Gemini "ask" function is reachable. Same values as the
  ; repo .env; never hard-code them here. Unset env -> builds without cloud
  ; (AI falls back to the mock).
  '-DFRIJ_SUPABASE_URL="${sysenv.SUPABASE_URL}"'
  '-DFRIJ_SUPABASE_ANON_KEY="${sysenv.SUPABASE_ANON_KEY}"'
