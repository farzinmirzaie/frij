; PlatformIO config — Fridge multi-app UI (M5Stack StopWatch Dev Kit, ESP32-S3)
;
; Two environments only, kept minimal on purpose:
;   emulator_Dial  -> runs the UI on your Mac via SDL2 (no hardware needed)
;   board_StopWatch -> flashes the real device (WIP: see TODO below)
;
; Target hardware: round 1.75" AMOLED 466x466 (CO5300), touch (CST820B),
; 2 buttons + IMU. The emulator uses the M5Dial round frame (240x240) as the
; closest stand-in — design for a ROUND screen, expect higher res on device.
; See docs/ARCHITECTURE.md for details.

[platformio]
default_envs = emulator_Dial

; ---- Shared settings for every environment ----
[env]
build_flags =
  -std=c++17
  -I include
  -I src
  -I src/utility

  ; LVGL v9 (UI library)
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -D LVGL_USE_V8=0
  -D LVGL_USE_V9=1

lib_deps =
  https://github.com/m5stack/M5GFX#develop
  lvgl=https://github.com/lvgl/lvgl#master
lib_archive = false


; ---- PC emulator (SDL2). This is what you run while building the UI. ----
[env:emulator_Dial]
platform = native@^1.2.1
build_type = debug
extra_scripts = support/sdl2_build_extra.py
build_flags =
  ${env.build_flags}

  ; SDL2 (installed via `brew install sdl2 pkg-config`)
  !pkg-config --cflags SDL2
  !pkg-config --libs SDL2
  -arch arm64          ; Apple Silicon Mac; remove on Intel/Linux

  ; Window: draw the device shell as a frame, white background, 2x zoom
  -D M5GFX_SHOW_FRAME
  -D M5GFX_BACK_COLOR=0xFFFFFFU
  -D M5GFX_SCALE=2
  -D M5GFX_ROTATION=0

  -D M5GFX_BOARD=board_M5Dial   ; round frame, closest stand-in for StopWatch
build_src_filter =
  +<*>
  -<src/utility/lvgl_port_m5stack.cpp>   ; SDL build uses sdl_main.cpp instead


; ---- Real device. TODO: M5GFX has no StopWatch board enum yet. ----
; When the StopWatch arrives, verify the correct M5GFX_BOARD value (and that
; M5GFX supports the CO5300 panel) before flashing. Left here as a placeholder.
[env:board_StopWatch]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_flags =
  ${env.build_flags}
  -D BOARD_HAS_PSRAM
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  ; -D M5GFX_BOARD=board_???   ; TODO: set once StopWatch is supported
