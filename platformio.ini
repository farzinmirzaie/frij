; PlatformIO config
;
; Two environments only, kept minimal on purpose:
;   emulator_Dial -> runs the UI on your Mac via SDL2 (no hardware needed)
;   device        -> flashes a real board (WIP: see TODO below)
;
; The project is target-agnostic: apps are pure LVGL and don't care about the
; board. Only src/utility/ is board-specific. The first physical target is an
; ESP32-S3 board with a round ~466px touch display, but you can add more device
; envs for other boards later. The emulator uses a round 240px frame as a
; stand-in — design for a ROUND screen. See docs/ARCHITECTURE.md and
; docs/HARDWARE.md.

[platformio]
default_envs = emulator_Dial

; ---- Shared settings for every environment ----
[env]
build_flags =
  -std=c++17
  -I include
  -I src
  -I src/utility

  ; LVGL v9 (UI library)
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -D LVGL_USE_V8=0
  -D LVGL_USE_V9=1

lib_deps =
  https://github.com/m5stack/M5GFX#develop
  lvgl=https://github.com/lvgl/lvgl#master
lib_archive = false


; ---- PC emulator (SDL2). This is what you run while building the UI. ----
[env:emulator_Dial]
platform = native@^1.2.1
build_type = debug
extra_scripts = support/sdl2_build_extra.py
build_flags =
  ${env.build_flags}

  ; SDL2 (installed via `brew install sdl2 pkg-config`)
  !pkg-config --cflags SDL2
  !pkg-config --libs SDL2
  -arch arm64          ; Apple Silicon Mac; remove on Intel/Linux

  ; Window: draw the device shell as a frame, white background, 2x zoom
  -D M5GFX_SHOW_FRAME
  -D M5GFX_BACK_COLOR=0xFFFFFFU
  -D M5GFX_SCALE=2
  -D M5GFX_ROTATION=0

  -D M5GFX_BOARD=board_M5Dial   ; round frame used as the emulator stand-in
build_src_filter =
  +<*>
  -<src/utility/lvgl_port_m5stack.cpp>   ; SDL build uses sdl_main.cpp instead


; ---- Real device (placeholder, WIP). ----
; First target: an ESP32-S3 board with a round touch display. Set the correct
; M5GFX_BOARD value (and confirm M5GFX supports its panel) before flashing.
; Copy this block to add more boards later. See docs/HARDWARE.md.
[env:device]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_flags =
  ${env.build_flags}
  -D BOARD_HAS_PSRAM
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  ; -D M5GFX_BOARD=board_???   ; TODO: set for your board
