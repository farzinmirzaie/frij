[platformio]
default_envs = emulator_Dial

[env]
build_flags =
  -std=c++17
  -I include
  -I src
  -I src/utility
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -D LVGL_USE_V9=1
lib_deps =
  https://github.com/m5stack/M5GFX#develop
  lvgl=https://github.com/lvgl/lvgl#master
  bblanchon/ArduinoJson@^7
lib_archive = false

[env:emulator_Dial]
platform = native@^1.2.1
build_type = debug
extra_scripts = support/sdl2_build_extra.py
build_flags =
  ${env.build_flags}
  !pkg-config --cflags SDL2
  !pkg-config --libs SDL2
  -arch arm64
  -l curl
  -pthread                     ; background threads for non-blocking cloud I/O
  -D M5GFX_SHOW_FRAME
  -D M5GFX_BACK_COLOR=0xFFFFFFU
  -D M5GFX_SCALE=2
  -D M5GFX_ROTATION=0
  -D M5GFX_BOARD=board_M5Dial
build_src_filter =
  +<*>
  -<src/utility/lvgl_port_m5stack.cpp>

; Round 466x466 emulator on LVGL's own SDL driver — previews the UI at the real
; device resolution + round shape. Uses src/utility/sdl_lvgl_main.cpp (M5GFX
; files excluded). See docs/HARDWARE.md.
[env:emulator_StopWatch]
platform = native@^1.2.1
build_type = debug
extra_scripts = support/sdl2_build_extra.py
build_flags =
  ${env.build_flags}
  !pkg-config --cflags SDL2
  !pkg-config --libs SDL2
  -arch arm64
  -l curl
  -pthread
  -D FRIJ_USE_LV_SDL           ; turn on LVGL's SDL driver (see lv_conf.h)
build_src_filter =
  +<*>
  -<main.cpp>
  -<utility/sdl_main.cpp>
  -<utility/lvgl_port_m5stack.cpp>

[env:device]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_flags =
  ${env.build_flags}
  -D BOARD_HAS_PSRAM
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  ; -D M5GFX_BOARD=board_???
