name: Calendar → Frij sync

# Mirrors one or more Google Calendar iCal feeds into the Frij store
# (store:events) for the device's Events app. Read-only: Google → Supabase.
# Each calendar is a GCALENDAR_* secret (value = url,name,color[,holiday]);
# configure them (+ the Supabase secrets shared with the Keep sync) in:
# Settings → Secrets and variables → Actions. Secrets can't be enumerated in
# YAML, so map one env line per calendar secret below.

on:
  schedule:
    - cron: "23 * * * *"    # hourly — Google caches the iCal feed anyway
  workflow_dispatch: {}     # also run on demand from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r src/packages/bridge/requirements.txt
      - run: python src/packages/bridge/calendar_to_frij.py
        env:
          # One line per calendar secret (value = url,name,color[,holiday]).
          # The script picks up every GCALENDAR_* env var; add/remove lines here
          # to match your secrets. An unset secret becomes empty and is skipped.
          GCALENDAR_FAMILY: ${{ secrets.GCALENDAR_FAMILY }}
          GCALENDAR_HOLIDAYS: ${{ secrets.GCALENDAR_HOLIDAYS }}
          # Home timezone for clock times. The calendar's own X-WR-TIMEZONE is
          # UTC, so the feed can't tell us; without this, 12:00 shows as 04:00.
          FRIJ_TZ: Asia/Kuala_Lumpur
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # SUPABASE_TABLE defaults to "store"; FRIJ_EVENTS_KEY to "events".
